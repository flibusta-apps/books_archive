[package]
name = "books_archive"
version = "0.1.0"
edition = "2021"


[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1


[dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
axum = "0.8.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tokio-util = { version = "0.7.14", features = ["io"] }
once_cell = "1.21.1"
thiserror = "2.0.12"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tempfile = "3.19.1"
subtle = "2.6.1"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
